name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install system dependencies required by python-for-android
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf autoconf-archive automake libtool libtool-bin m4 gettext pkg-config \
          build-essential gcc g++ make cmake bison flex \
          libffi-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev \
          libncurses-dev libncursesw5-dev liblzma-dev
        # Diagnostic: verify autoconf
        echo "=== autoconf info ==="
        autoconf --version || true
        which autoconf || true
        readlink -f $(which autoconf) || true

    - name: Cache .buildozer (optional)
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-${{ runner.os }}-v1-${{ hashFiles('**/buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-v1-

    - name: Clean previous buildozer state (fresh start)
      run: |
        rm -rf .buildozer
        mkdir -p .buildozer

    - name: Install pip deps (buildozer & dependencies)
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install buildozer==1.6.0 pyjnius==1.4.0 || pip install buildozer

    - name: Ensure Android SDK cmdline-tools present (defensive)
      run: |
        # If you manage SDK yourself, adjust paths as needed. This is defensive:
        sudo apt-get install -y --no-install-recommends unzip
        # no-op here; buildozer will download SDK/NDK when needed

    - name: Build APK with buildozer
      env:
        # 如果你有自定义 SDK/NDK 路径, 在此处设置 ANDROID_SDK_ROOT / ANDROID_NDK_HOME
        # ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        # ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      run: |
        set -euo pipefail
        # defensive: show diagnostic info before starting
        echo "Python: $(python --version)"
        echo "Pip: $(pip --version)"
        echo "Buildozer: $(buildozer --version || true)"
        # Ensure buildozer.spec requirements are correct
        sed -n '1,160p' buildozer.spec || true
        # Run buildozer; keep log_level=2 in spec so output is verbose
        buildozer android debug || { echo "Buildozer failed; attempting diagnostic steps"; exit 1; }

    - name: { Defensive: "if python-for-android cloned, run autoupdate/autoreconf" }
      if: failure()
      run: |
        if [ -d ".buildozer/android/platform/python-for-android" ]; then
          cd .buildozer/android/platform/python-for-android || exit 0
          echo "Running autoupdate / autoreconf..."
          autoupdate || true
          autoreconf -vfi || true
          echo "autoreconf exit code: $?"
          cd - >/dev/null || true
        else
          echo "python-for-android not present yet"
        fi

    - name: Upload build artifacts (if any)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-artifacts
        path: |
          bin/*.apk
          bin/*.aab
          .buildozer/android/platform/*